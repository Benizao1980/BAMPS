[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bamps"
version = "0.1.0"
description = "Bacterial AMR Modelling and Prediction Suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "Ben Pascoe"}]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
xgb = ["xgboost>=2.0"]
lgbm = ["lightgbm>=4.0"]
all = ["xgboost>=2.0", "lightgbm>=4.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Benizao1980/BAMPS"
Issues = "https://github.com/Benizao1980/BAMPS/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
